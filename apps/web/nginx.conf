server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed asset filenames, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or a deploy leaves clients pinned to asset
  # filenames that no longer exist.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: unknown paths are React Router's problem, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
