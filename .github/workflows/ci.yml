name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run's result irrelevant; cancel it rather than
# paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Types
        working-directory: apps/api
        # Not blocking yet: the codebase is typed but mypy on SQLAlchemy models needs
        # more plugin configuration than it is worth right now. Visible, not enforced.
        run: mypy app || true

      - name: Tests
        working-directory: apps/api
        run: pytest -q

  migrations:
    name: Migrations — apply to a real Postgres
    runs-on: ubuntu-latest
    # The unit suite runs on SQLite for speed. This job is what catches anything SQLite
    # forgives: enum handling, the deferred foreign key, JSONB, server defaults.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: understudy
          POSTGRES_PASSWORD: understudy
          POSTGRES_DB: understudy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U understudy"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        working-directory: apps/api
        run: pip install -e ".[dev]"

      - name: Upgrade, then downgrade, then upgrade again
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://understudy:understudy@localhost:5432/understudy
        # The round trip is the point: a migration that cannot be reversed is a
        # migration you cannot roll back a deploy past.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models and migrations agree
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://understudy:understudy@localhost:5432/understudy
        # Autogenerate against an up-to-date database must produce an empty migration.
        # Otherwise someone changed a model and forgot the migration.
        run: |
          alembic revision --autogenerate -m "ci drift check" --rev-id ci_drift 2>/dev/null \
            || alembic revision --autogenerate -m "ci drift check" --rev-id ci_drift
          if grep -qE "op\.(create|drop|alter|add)_" alembic/versions/ci_drift_*.py; then
            echo "::error::Models have drifted from migrations. Generated operations:"
            grep -E "op\.(create|drop|alter|add)_" alembic/versions/ci_drift_*.py
            exit 1
          fi
          rm -f alembic/versions/ci_drift_*.py

  contract:
    name: Contract — generated types match the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -e "apps/api[dev]"
          npm ci

      # This is the job that makes the typed contract real rather than aspirational:
      # change a Pydantic response model without regenerating, and the build fails.
      - name: Regenerate and diff
        run: npm run gen:api:check

  web:
    name: Web — lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build --workspace @understudy/web

  e2e:
    name: E2E — the flow that has to work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -e "apps/api[dev]"
          npm ci

      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # No Postgres, Redis, MinIO or GPU here: Playwright starts the API in its
      # dependency-free mode. See apps/web/playwright.config.ts.
      - name: Run
        working-directory: apps/web
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
